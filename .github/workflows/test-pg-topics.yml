name: pg_topics tests

on:
  pull_request:
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PGRX_VERSION: '0.12.9'

jobs:
  changes:
    name: detect pg_topics changes
    runs-on: ubuntu-latest
    outputs:
      pgt: ${{ steps.filter.outputs.pgt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref ($BASE); running the full suite"
            echo "pgt=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(extensions/pg_topics/|\.github/workflows/test-pg-topics\.yml$)'; then
            echo "pgt=true" >> "$GITHUB_OUTPUT"
          else
            echo "pgt=false" >> "$GITHUB_OUTPUT"
          fi

  unit-and-build:
    name: pg_topics unit tests + extension build (PG${{ matrix.pg }})
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        pg: [17]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.pgt == 'true'

      - name: Cache cargo
        if: needs.changes.outputs.pgt == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            extensions/pg_topics/core/target
            extensions/pg_topics/extension/target
          key: pgt-cargo-${{ runner.os }}-pg${{ matrix.pg }}-${{ hashFiles('extensions/pg_topics/**/Cargo.lock') }}

      - name: Unit tests (core)
        if: needs.changes.outputs.pgt == 'true'
        working-directory: extensions/pg_topics/core
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Add the PostgreSQL apt repository
        if: needs.changes.outputs.pgt == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

      - name: Install PostgreSQL ${{ matrix.pg }} + build deps
        if: needs.changes.outputs.pgt == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            clang libclang-dev llvm-dev

      - name: Install cargo-pgrx ${{ env.PGRX_VERSION }}
        if: needs.changes.outputs.pgt == 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked

      - name: Set up the pgrx build environment
        if: needs.changes.outputs.pgt == 'true'
        run: bash extensions/pg_topics/bench/setup_local_pg.sh

      - name: Extension fmt + clippy
        if: needs.changes.outputs.pgt == 'true'
        working-directory: extensions/pg_topics/extension
        env:
          PGRX_HOME: /home/runner/.cache/pg_topics/pgrx
          PG_CONFIG: /home/runner/.cache/pg_topics/pg17/usr/lib/postgresql/17/bin/pg_config
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --no-default-features --features "pg${{ matrix.pg }} pg_test" -- -D warnings

      - name: cargo pgrx test pg${{ matrix.pg }}
        if: needs.changes.outputs.pgt == 'true'
        working-directory: extensions/pg_topics/extension
        env:
          PGRX_HOME: /home/runner/.cache/pg_topics/pgrx
          PG_CONFIG: /home/runner/.cache/pg_topics/pg17/usr/lib/postgresql/17/bin/pg_config
        run: cargo pgrx test pg${{ matrix.pg }}

      - name: pg_topics untouched
        if: needs.changes.outputs.pgt != 'true'
        run: |
          echo "No file under extensions/pg_topics/ changed in this commit."
          echo "The suite has nothing to test; reporting success so this"
          echo "required check does not block the pull request."

  harnesses:
    name: pg_topics bench harnesses (PG${{ matrix.pg }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        pg: [17]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.pgt == 'true'

      - name: Cache cargo
        if: needs.changes.outputs.pgt == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            extensions/pg_topics/core/target
            extensions/pg_topics/extension/target
          key: pgt-harness-${{ runner.os }}-pg${{ matrix.pg }}-${{ hashFiles('extensions/pg_topics/**/Cargo.lock') }}

      - name: Add the PostgreSQL apt repository
        if: needs.changes.outputs.pgt == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

      - name: Install PostgreSQL ${{ matrix.pg }} + build deps
        if: needs.changes.outputs.pgt == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            clang libclang-dev llvm-dev

      - name: Install cargo-pgrx ${{ env.PGRX_VERSION }}
        if: needs.changes.outputs.pgt == 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked

      - name: Set up the pgrx build environment
        if: needs.changes.outputs.pgt == 'true'
        run: bash extensions/pg_topics/bench/setup_local_pg.sh

      - name: Run gate harnesses
        if: needs.changes.outputs.pgt == 'true'
        working-directory: extensions/pg_topics
        env:
          PGRX_HOME: /home/runner/.cache/pg_topics/pgrx
          PG_CONFIG: /home/runner/.cache/pg_topics/pg17/usr/lib/postgresql/17/bin/pg_config
        run: |
          failed=""
          for h in stamp_order stamper durability ordering stamper_split retention sync sql_consumer \
                   kafka_basic listener_restart kafka_groups kafka_idempotent kafka_admin security \
                   monitoring failover replicated band_spread client_matrix; do
            echo "::group::run_$h.sh"
            timeout 20m bash "bench/run_$h.sh" || failed="$failed run_$h.sh"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed harnesses:$failed"
            exit 1
          fi

      - name: pg_topics untouched
        if: needs.changes.outputs.pgt != 'true'
        run: |
          echo "No file under extensions/pg_topics/ changed in this commit."
          echo "The suite has nothing to test; reporting success so this"
          echo "required check does not block the pull request."

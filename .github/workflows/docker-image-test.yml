name: Docker Image Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - develop
      - release/*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: supatype-postgres:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      - name: Start container
        run: |
          docker run -d --name pg_test \
            -e POSTGRES_PASSWORD=testpassword \
            -p 5432:5432 \
            supatype-postgres:test
          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 30); do
            if docker exec pg_test pg_isready -U supatype_admin -q 2>/dev/null; then
              echo "PostgreSQL ready"
              break
            fi
            sleep 2
          done

      - name: Verify extensions
        run: |
          docker exec -e PGPASSWORD=testpassword pg_test psql -U supatype_admin -d postgres -c "
            SELECT name FROM pg_available_extensions
            WHERE name IN (
              'pgcrypto','uuid-ossp','pg_stat_statements',
              'pg_cron','pg_net',
              'postgis','vector','pg_graphql','pgjwt'
            )
            ORDER BY name;
          "

      - name: Verify shared_preload_libraries
        run: |
          docker exec -e PGPASSWORD=testpassword pg_test psql -U supatype_admin -d postgres -c "
            SHOW shared_preload_libraries;
          "

      - name: Verify pg_guard loaded
        run: |
          docker exec -e PGPASSWORD=testpassword pg_test psql -U supatype_admin -d postgres -c "
            SHOW session_preload_libraries;
          "
          docker exec -e PGPASSWORD=testpassword pg_test psql -U supatype_admin -d postgres -c "
            SHOW pg_guard.privileged_role;
          "

      - name: Verify wal2json logical decoding plugin
        run: |
          docker exec -e PGPASSWORD=testpassword pg_test psql -U supatype_admin -d postgres -c "
            SELECT slot_name FROM pg_create_logical_replication_slot('ci_wal2json_test', 'wal2json');
            SELECT pg_drop_replication_slot('ci_wal2json_test');
          "

      - name: Show logs on failure
        if: failure()
        run: docker logs pg_test || true

      - name: Cleanup
        if: always()
        run: docker rm -f pg_test || true

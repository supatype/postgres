name: Docker Image Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - develop
      - release/*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: Dockerfile
          load: true
          tags: supatype-postgres:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      - name: Start container
        run: |
          docker run -d --name pg_test \
            -e POSTGRES_PASSWORD=testpassword \
            -p 5432:5432 \
            supatype-postgres:test
          echo "Waiting for PostgreSQL to be ready..."
          for i in $(seq 1 30); do
            if docker exec pg_test pg_isready -U supatype_admin -q 2>/dev/null; then
              echo "PostgreSQL ready"
              break
            fi
            sleep 2
          done

      - name: Verify extensions
        run: |
          docker exec -e PGPASSWORD=testpassword pg_test psql -U supatype_admin -d postgres -c "
            SELECT name FROM pg_available_extensions
            WHERE name IN (
              'pgcrypto','uuid-ossp','pg_stat_statements',
              'pg_cron','pg_net',
              'postgis','vector','pg_graphql','pgjwt','supatype_mask'
            )
            ORDER BY name;
          "

      - name: Verify shared_preload_libraries
        run: |
          docker exec -e PGPASSWORD=testpassword pg_test psql -U supatype_admin -d postgres -c "
            SHOW shared_preload_libraries;
          "

      - name: Verify pg_guard loaded
        run: |
          docker exec -e PGPASSWORD=testpassword pg_test psql -U supatype_admin -d postgres -c "
            SHOW session_preload_libraries;
          "
          docker exec -e PGPASSWORD=testpassword pg_test psql -U supatype_admin -d postgres -c "
            SHOW pg_guard.privileged_role;
          "

      - name: Verify supatype_mask masks a column
        env:
          # migrate.sh bootstraps the database named after POSTGRES_USER, which is where
          # `CREATE EXTENSION supatype_mask` landed. `postgres` has the preloaded library
          # but not the extension, so the deny assertion below needs this one.
          PGDATABASE: supatype_admin
        run: |
          # End to end rather than "is it installed": the failure mode that matters is a
          # column that quietly comes back unmasked, and only a real query catches it.
          # supatype_admin is a superuser and therefore exempt, so this runs as a plain
          # role.
          run() {
            docker exec -e PGPASSWORD=testpassword -i pg_test \
              psql -U supatype_admin -d "$PGDATABASE" "$@"
          }

          # `pg_isready` succeeds while the entrypoint is still running the bootstrap
          # migrations -- the server is listening on its private socket throughout. This
          # extension is created by the *last* migration, so waiting for the extension
          # itself is the only reliable readiness signal for this step.
          for i in $(seq 1 60); do
            [ "$(run -tAc "SELECT count(*) FROM pg_extension WHERE extname = 'supatype_mask'" 2>/dev/null)" = "1" ] && break
            sleep 2
          done
          run -tAc "SELECT extname, extversion FROM pg_extension WHERE extname = 'supatype_mask'"
          # -tAc with leading SETs prints a "SET" line per command, so take the last.
          query() { run -tAc "SET ROLE ci_reader; SET ci.uid = '$1'; $2" | tail -1; }

          run -v ON_ERROR_STOP=1 -q <<'SQL'
            CREATE TABLE ci_mask (id int, secret text, owner text);
            INSERT INTO ci_mask VALUES (1, 'shhh', 'alice');

            CREATE FUNCTION can_read_ci_mask__secret(ci_mask ci_mask) RETURNS boolean
              LANGUAGE sql STABLE AS $$
                SELECT owner = current_setting('ci.uid', true)
                  FROM (SELECT ($1).*) AS ci_mask;
              $$;

            SECURITY LABEL FOR supatype ON COLUMN ci_mask.secret
              IS 'MASK READ public.can_read_ci_mask__secret';

            CREATE ROLE ci_reader;
            GRANT SELECT ON ci_mask TO ci_reader;
          SQL

          masked=$(query bob   "SELECT coalesce(secret, '<masked>') FROM ci_mask;")
          shown=$(query alice  "SELECT secret FROM ci_mask;")
          # Also exercises the extension's rejection function, not just the library.
          denied=$(query bob "SELECT count(secret) FROM ci_mask;" 2>&1 || true)

          echo "non-owner sees: $masked"
          echo "owner sees:     $shown"
          echo "aggregate:      $denied"
          test "$masked" = "<masked>" || { echo "FAIL: column was not masked"; exit 1; }
          test "$shown" = "shhh" || { echo "FAIL: owner could not read the column"; exit 1; }
          case "$denied" in
            *"cannot be aggregated"*) ;;
            *) echo "FAIL: aggregate over a masked column was not rejected"; exit 1 ;;
          esac

      - name: Verify wal2json logical decoding plugin
        run: |
          docker exec -e PGPASSWORD=testpassword pg_test psql -U supatype_admin -d postgres -c "
            SELECT slot_name FROM pg_create_logical_replication_slot('ci_wal2json_test', 'wal2json');
            SELECT pg_drop_replication_slot('ci_wal2json_test');
          "

      - name: Verify the migration ledger records the bootstrap
        env:
          PGDATABASE: supatype_admin
        run: |
          # First boot goes through the bootstrap script, which runs every migration and
          # records each one. Nothing should be flagged `backfilled` here: these
          # were observed running, not assumed.
          run() {
            docker exec -e PGPASSWORD=testpassword -i pg_test \
              psql -U supatype_admin -d "$PGDATABASE" "$@"
          }
          shipped=$(docker exec pg_test sh -c 'ls /docker-entrypoint-initdb.d/migrations/*.sql | wc -l' | tr -d ' ')
          recorded=$(run -tAc "SELECT count(*) FROM supatype_migrations.applied")
          assumed=$(run -tAc "SELECT count(*) FROM supatype_migrations.applied WHERE backfilled")
          echo "shipped=$shipped recorded=$recorded assumed=$assumed"
          test "$recorded" = "$shipped" || { echo "FAIL: ledger recorded $recorded of $shipped migrations"; exit 1; }
          test "$assumed" = "0" || { echo "FAIL: $assumed migrations were assumed rather than run on a fresh volume"; exit 1; }

      # The regression in #138: the image was only ever tested with `docker run`
      # against a fresh container, so the path where a data directory already
      # exists -- the one every upgrade takes -- was never exercised at all.
      - name: Restart over an existing volume applies migrations added since
        env:
          PGDATABASE: supatype_admin
        run: |
          set -euo pipefail

          # Over TCP, deliberately: the temporary server the entrypoint applies
          # migrations against listens on the Unix socket only (listen_addresses
          # = ''), so a socket pg_isready goes true while migrations are still
          # running. A TCP answer means the real server is up, which means the
          # entrypoint is done.
          wait_ready() {
            for i in $(seq 1 90); do
              docker exec "$1" pg_isready -h 127.0.0.1 -U supatype_admin -q 2>/dev/null && return 0
              sleep 2
            done
            echo "FAIL: $1 never became ready"; docker logs "$1"; exit 1
          }
          psql_in() {
            docker exec -e PGPASSWORD=testpassword -i "$1" \
              psql -U supatype_admin -d "$PGDATABASE" -tAc "$2"
          }

          docker volume create pg_upgrade_vol > /dev/null

          # --- the "old image" boot: a volume created before the new migration
          docker run -d --name pg_v1 -e POSTGRES_PASSWORD=testpassword \
            -v pg_upgrade_vol:/var/lib/postgresql/data supatype-postgres:test
          wait_ready pg_v1
          baseline=$(psql_in pg_v1 "SELECT count(*) FROM supatype_migrations.applied")
          echo "baseline ledger rows: $baseline"
          docker rm -f pg_v1 > /dev/null

          # --- the "new image" boot: same volume, one migration the volume has
          # never seen. docker cp before start stands in for a rebuilt image.
          cat > /tmp/29990101000000_ci_upgrade_probe.sql <<'SQL'
          -- migrate:up
          CREATE TABLE IF NOT EXISTS ci_upgrade_probe (applied_at timestamptz DEFAULT now());
          INSERT INTO ci_upgrade_probe DEFAULT VALUES;
          SQL
          docker create --name pg_v2 -e POSTGRES_PASSWORD=testpassword \
            -v pg_upgrade_vol:/var/lib/postgresql/data supatype-postgres:test > /dev/null
          docker cp /tmp/29990101000000_ci_upgrade_probe.sql \
            pg_v2:/docker-entrypoint-initdb.d/migrations/29990101000000_ci_upgrade_probe.sql
          docker start pg_v2 > /dev/null
          wait_ready pg_v2

          probe=$(psql_in pg_v2 "SELECT count(*) FROM ci_upgrade_probe")
          rows=$(psql_in pg_v2 "SELECT count(*) FROM supatype_migrations.applied")
          assumed=$(psql_in pg_v2 "SELECT count(*) FROM supatype_migrations.applied WHERE backfilled")
          echo "probe rows=$probe ledger=$rows assumed=$assumed"

          # The whole point: the new migration ran on a data directory the stock
          # entrypoint would have skipped entirely.
          test "$probe" = "1" || { echo "FAIL: migration added after the volume was created did not run"; docker logs pg_v2; exit 1; }
          # And exactly once -- not replayed on top of what was already applied.
          test "$rows" = "$((baseline + 1))" || { echo "FAIL: expected $((baseline + 1)) ledger rows, got $rows"; exit 1; }
          test "$assumed" = "0" || { echo "FAIL: $assumed migrations were assumed on a ledger-bearing volume"; exit 1; }

          # Restarting again must not re-run it.
          docker restart pg_v2 > /dev/null
          wait_ready pg_v2
          probe_again=$(psql_in pg_v2 "SELECT count(*) FROM ci_upgrade_probe")
          test "$probe_again" = "1" || { echo "FAIL: migration re-ran on restart ($probe_again rows)"; exit 1; }

      - name: Adopting a volume with no ledger backfills without replaying
        env:
          PGDATABASE: supatype_admin
        run: |
          set -euo pipefail
          psql_in() {
            docker exec -e PGPASSWORD=testpassword -i "$1" \
              psql -U supatype_admin -d "$PGDATABASE" -tAc "$2"
          }

          # Stand in for a volume created before the ledger existed: drop it and
          # restart. Nothing may be replayed, and everything must be flagged as
          # assumed so `supatype migrate status` can tell an operator the truth.
          psql_in pg_v2 "DROP SCHEMA supatype_migrations CASCADE" > /dev/null
          before=$(psql_in pg_v2 "SELECT count(*) FROM ci_upgrade_probe")
          docker restart pg_v2 > /dev/null
          for i in $(seq 1 90); do
            docker exec pg_v2 pg_isready -h 127.0.0.1 -U supatype_admin -q 2>/dev/null && break
            sleep 2
          done

          rows=$(psql_in pg_v2 "SELECT count(*) FROM supatype_migrations.applied")
          assumed=$(psql_in pg_v2 "SELECT count(*) FROM supatype_migrations.applied WHERE backfilled")
          after=$(psql_in pg_v2 "SELECT count(*) FROM ci_upgrade_probe")
          echo "ledger=$rows assumed=$assumed probe before=$before after=$after"

          test "$rows" = "$assumed" || { echo "FAIL: $((rows - assumed)) rows were not flagged as assumed"; exit 1; }
          test "$rows" -gt 0 || { echo "FAIL: ledger was not rebuilt"; exit 1; }
          test "$after" = "$before" || { echo "FAIL: backfill replayed migrations against live data"; exit 1; }

          # The operator's way back out of an assumed ledger. POSTGRES_PASSWORD
          # because the shipped pg_hba.conf wants scram for supatype_admin, and
          # POSTGRES_DB because a `docker exec` does not inherit the entrypoint
          # process's environment.
          exec_migrate() {
            docker exec -e POSTGRES_PASSWORD=testpassword -e POSTGRES_DB="$PGDATABASE" \
              pg_v2 supatype migrate "$@"
          }
          exec_migrate status | tail -5
          exec_migrate replay 29990101000000_ci_upgrade_probe.sql
          replayed=$(psql_in pg_v2 "SELECT count(*) FROM ci_upgrade_probe")
          test "$replayed" = "$((before + 1))" || { echo "FAIL: replay did not re-run the migration"; exit 1; }

      # The operator path out of an adopted ledger: doctor asks the database
      # whether the load-bearing migrations took effect, rather than trusting a
      # ledger that by construction cannot know.
      - name: doctor detects and repairs a migration that never took effect
        env:
          PGDATABASE: supatype_admin
        run: |
          set -euo pipefail
          psql_in() {
            docker exec -e PGPASSWORD=testpassword -i pg_v2 \
              psql -U supatype_admin -d "$PGDATABASE" -tAc "$1"
          }
          exec_migrate() {
            docker exec -e POSTGRES_PASSWORD=testpassword -e POSTGRES_DB="$PGDATABASE" \
              pg_v2 supatype migrate "$@"
          }

          # A healthy container: every check passes and the exit status says so.
          exec_migrate doctor
          echo "doctor is clean on a healthy container"

          # Now reproduce the failure #138 actually causes: the migration was
          # marked applied, but its effect is not in the database. This is the
          # pg_guard case -- without it privilege enforcement is off for every
          # PostgREST session.
          psql_in "ALTER ROLE authenticator RESET session_preload_libraries" > /dev/null
          preload=$(psql_in "SELECT coalesce(array_to_string(rolconfig, ','), '') FROM pg_roles WHERE rolname='authenticator'")
          echo "after RESET, authenticator rolconfig: [$preload]"
          case "$preload" in *pg_guard*) echo "FAIL: could not stage the broken state"; exit 1 ;; esac

          rc=0; out=$(exec_migrate doctor 2>&1) || rc=$?
          echo "$out"
          test "$rc" -ne 0 || { echo "FAIL: doctor exited 0 with pg_guard missing"; exit 1; }
          case "$out" in
            *"MISSING  pg_guard preloaded for authenticator"*) ;;
            *) echo "FAIL: doctor did not name the missing check"; exit 1 ;;
          esac
          case "$out" in
            *20260810150000_authenticator_session_preload.sql*) ;;
            *) echo "FAIL: doctor did not name the migration to replay"; exit 1 ;;
          esac

          # --fix applies exactly that migration and re-verifies.
          exec_migrate doctor --fix
          fixed=$(psql_in "SELECT array_to_string(rolconfig, ',') FROM pg_roles WHERE rolname='authenticator'")
          echo "after --fix, authenticator rolconfig: [$fixed]"
          case "$fixed" in
            *pg_guard*) ;;
            *) echo "FAIL: doctor --fix did not restore pg_guard"; exit 1 ;;
          esac
          exec_migrate doctor
          echo "doctor is clean again"

      # The other jobs here all run with SUPATYPE_KEYSPACE_ENABLED unset, which is half the
      # contract: the image must be unchanged without it. This is the other half, and it is the
      # gate the feature is actually for -- serving RESP *with persistence*, which is a different
      # thing from serving RESP. Without the extension the worker comes up and answers PING while
      # refusing to persist, saying so once in the log and nowhere else, so a stack configured for
      # durable keys would be silently ephemeral. Asserting persisted=true is what catches that.
      - name: Keyspace enabled serves RESP and persists
        run: |
          docker run -d --name pg_keyspace_test \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=supatype \
            -e SUPATYPE_KEYSPACE_ENABLED=1 \
            -e SUPATYPE_KEYSPACE_DURABILITY=ephemeral \
            -e SUPATYPE_KEYSPACE_DURABILITY_OVERRIDES='kong_acme:=durable' \
            -e SUPATYPE_KEYSPACE_KEYS=10000 \
            -e SUPATYPE_KEYSPACE_RING_MB=4 \
            -p 6379:6379 \
            supatype-postgres:test
          # -h 127.0.0.1, and the reason is the one the Dockerfile's own HEALTHCHECK gives:
          # initialisation runs against a temporary server listening on the Unix socket alone, so
          # a socket probe reports ready mid-migration. A TCP answer means the real server is up,
          # which is the only one whose worker has the extension and can persist.
          for i in $(seq 1 60); do
            if docker exec pg_keyspace_test pg_isready -h 127.0.0.1 -U supatype_admin -q 2>/dev/null; then break; fi
            sleep 2
          done

          # The worker starts asynchronously after the postmaster, and during initialisation it
          # runs once against the temporary server *without* the extension -- logging
          # persisted=false. So wait for the line that only the real start can produce rather than
          # reading the log the moment Postgres answers.
          for i in $(seq 1 30); do
            if docker logs pg_keyspace_test 2>&1 | grep -q "persisted=true"; then break; fi
            sleep 2
          done

          logs=$(docker logs pg_keyspace_test 2>&1)
          case "$logs" in
            *"RESP listening"*) ;;
            *) echo "FAIL: no RESP listener in the log"; echo "$logs" | tail -40; exit 1 ;;
          esac
          case "$logs" in
            *"persisted=true"*) ;;
            *) echo "FAIL: RESP came up without persistence -- the extension was not created before the real start"
               echo "$logs" | grep -i keyspace || true; exit 1 ;;
          esac
          case "$logs" in
            *"kong_acme:*=durable"*) ;;
            *) echo "FAIL: durability_overrides did not reach the worker"; echo "$logs" | grep -i durability || true; exit 1 ;;
          esac
          echo "worker: RESP up, persistence on, per-key durability applied"

          # And the policy resolves per key, not just at startup: the named prefix persists, and
          # everything else stays in shared memory.
          docker exec -e PGPASSWORD=testpassword pg_keyspace_test \
            psql -U supatype_admin -d supatype -tA -c "
              SELECT CASE
                WHEN supacache.key_durability('kong_acme:cert_key:example.com') = 'durable'
                 AND supacache.key_durability('cache:rest:abc') = 'ephemeral'
                THEN 'ok' ELSE 'FAIL' END" | grep -qx ok \
            || { echo "FAIL: key_durability did not resolve the ACME prefix to durable"; exit 1; }
          echo "key_durability: kong_acme: -> durable, everything else -> ephemeral"

      # Mode B, which is a different claim from Mode A above: the RESP keyspace can be perfectly
      # healthy while the row cache is inert or, worse, serving rows nothing will ever invalidate.
      # Every assertion here failed at least once while this was being written, which is the point
      # of having them -- see the output_plugin_libraries case, where the only symptom is a
      # background worker exiting once a second next to a keyspace that looks fine.
      - name: Row cache decodes, plans and invalidates
        run: |
          docker run -d --name pg_rowcache_test \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=supatype \
            -e SUPATYPE_KEYSPACE_ENABLED=1 \
            -e SUPATYPE_KEYSPACE_KEYS=10000 \
            -e SUPATYPE_KEYSPACE_RING_MB=4 \
            -e SUPATYPE_KEYSPACE_ROWCACHE_DECODE=1 \
            -e SUPATYPE_KEYSPACE_ROWCACHE_READTHROUGH=1 \
            -e SUPATYPE_KEYSPACE_SLOT_WAL_KEEP=256MB \
            supatype-postgres:test

          ready=no
          for i in $(seq 1 60); do
            if docker exec pg_rowcache_test pg_isready -h 127.0.0.1 -U supatype_admin -q 2>/dev/null; then ready=yes; break; fi
            sleep 2
          done
          if [ "$ready" != yes ]; then
            echo "FAIL: the server never accepted TCP connections."
            echo "An unrecognised parameter in the generated conf stops a cluster from starting, and"
            echo "that is exactly what this looks like from outside. Conf and log follow."
            docker exec pg_rowcache_test cat /etc/postgresql-custom/pg_keyspace.conf || true
            docker logs pg_rowcache_test 2>&1 | grep -vF 'database "supatype_admin" does not exist' | tail -40
            exit 1
          fi
          # "RESP listening", not "persisted=true". persisted reports whether the *persistence*
          # machinery is running, which needs at least one durable prefix — the keyspace step above
          # gets it from kong_acme:=durable. This container is deliberately all-ephemeral, because
          # Mode B is a cache in shared memory and has nothing to do with Mode A durability, so
          # persisted=false is the right answer here and waiting for true never returns. (It did
          # not: that wait is what failed the first four runs of this step.)
          serving=no
          for i in $(seq 1 30); do
            if docker logs pg_rowcache_test 2>&1 | grep -q "RESP listening"; then serving=yes; break; fi
            sleep 2
          done
          if [ "$serving" != yes ]; then
            echo "FAIL: the RESP worker never came up"
            docker logs pg_rowcache_test 2>&1 | grep -i keyspace | tail -20
            exit 1
          fi

          echo "::group::row cache: what the toggle wrote, and what the server made of it"
          docker exec pg_rowcache_test cat /etc/postgresql-custom/pg_keyspace.conf || true
          docker logs pg_rowcache_test 2>&1 | grep -vF 'database "supatype_admin" does not exist' \
            | grep -iE "keyspace|rowcache|invalidation|FATAL|unrecognized" | tail -20 || true
          echo "::endgroup::"

          psql_test() {
            docker exec -e PGPASSWORD=testpassword pg_rowcache_test \
              psql -U supatype_admin -d supatype -tA "$@"
          }

          # A table with a primary key, registered. Registration is what makes a database
          # participate; the decoder takes a slot per participating database and nothing else.
          psql_test -c "CREATE TABLE orders (id bigint PRIMARY KEY, total numeric)" >/dev/null
          psql_test -c "INSERT INTO orders SELECT g, g FROM generate_series(1,200) g" >/dev/null
          echo "assert: rowcache_register" | tee -a /tmp/rowcache-progress
          psql_test -c "SELECT supacache.rowcache_register('public.orders')" | grep -qx t \
            || { echo "FAIL: rowcache_register did not return true"; exit 1; }

          for i in $(seq 1 30); do
            if docker logs pg_rowcache_test 2>&1 | grep -q "invalidation 0: draining slot"; then break; fi
            sleep 1
          done
          logs=$(docker logs pg_rowcache_test 2>&1)
          case "$logs" in
            *"invalidation 0: draining slot"*) ;;
            *) echo "FAIL: the invalidation worker never started draining."
               echo "If it is exiting with code 1, read the ERROR above it -- an output plugin that"
               echo "is not allowlisted fails exactly this way."
               echo "$logs" | grep -iE "invalidation|output plugin|ERROR" | tail -20; exit 1 ;;
          esac

          # The slot exists, is ours, and is bounded by the value the toggle wrote rather than the
          # image's global 4096.
          echo "assert: decode slot exists" | tee -a /tmp/rowcache-progress
          psql_test -c "SELECT plugin FROM pg_replication_slots WHERE slot_name LIKE 'supacache_rowcache%'" \
            | grep -qx supacache_keys \
            || { echo "FAIL: no decode slot with the supacache_keys plugin"; exit 1; }
          echo "assert: max_slot_wal_keep_size" | tee -a /tmp/rowcache-progress
          psql_test -c "SHOW max_slot_wal_keep_size" | grep -qx 256MB \
            || { echo "FAIL: SUPATYPE_KEYSPACE_SLOT_WAL_KEEP did not beat the image default"; exit 1; }

          # On the read path at all: with readthrough off this is a plain index scan, so the custom
          # scan node is the assertion that Mode B is actually serving reads.
          echo "assert: planner chooses the row cache" | tee -a /tmp/rowcache-progress
          psql_test -c "EXPLAIN (COSTS OFF) SELECT * FROM orders WHERE id = 7" \
            | grep -q "Custom Scan (pg_keyspace_rowcache)" \
            || { echo "FAIL: the planner did not choose the row cache"
                 psql_test -c "EXPLAIN (COSTS OFF) SELECT * FROM orders WHERE id = 7"; exit 1; }

          # And a write invalidates: warm the row, change it, and the next reads must converge on
          # the new value well inside a second at the default 200ms decode interval.
          psql_test -c "SELECT total FROM orders WHERE id = 7" >/dev/null
          echo "assert: an UPDATE invalidates" | tee -a /tmp/rowcache-progress
          psql_test -c "UPDATE orders SET total = 4242 WHERE id = 7" >/dev/null
          got=stale
          for i in $(seq 1 20); do
            got=$(psql_test -c "SELECT total FROM orders WHERE id = 7" | tr -d ' ')
            if [ "$got" = "4242" ]; then break; fi
            sleep 0.5
          done
          [ "$got" = "4242" ] \
            || { echo "FAIL: a cached row survived the UPDATE that changed it (read back: $got)"
                 psql_test -c "SELECT * FROM supacache.pg_stat_keyspace_invalidation"; exit 1; }

          # Coherence is what the monitoring will alert on, and it has to say participating rather
          # than merely not-broken.
          psql_test -c "SELECT state || ',' || coherent FROM supacache.pg_stat_keyspace_rowcache_databases WHERE datname = 'supatype'" \
            | grep -qx "participating,t" \
            || { echo "FAIL: the database is not coherently participating"
                 psql_test -c "SELECT * FROM supacache.pg_stat_keyspace_rowcache_databases"; exit 1; }

          echo "row cache: decoding, planned, invalidating, coherent"

      # Read-through with no decoder warms rows nothing will ever invalidate, so the entrypoint
      # refuses it rather than passing it to an extension that silently ignores it.
      - name: Read-through without decode is refused, not ignored
        run: |
          docker run -d --name pg_rowcache_guard \
            -e POSTGRES_PASSWORD=testpassword \
            -e POSTGRES_DB=supatype \
            -e SUPATYPE_KEYSPACE_ENABLED=1 \
            -e SUPATYPE_KEYSPACE_KEYS=10000 \
            -e SUPATYPE_KEYSPACE_RING_MB=4 \
            -e SUPATYPE_KEYSPACE_ROWCACHE_READTHROUGH=1 \
            supatype-postgres:test
          for i in $(seq 1 60); do
            if docker exec pg_rowcache_guard pg_isready -h 127.0.0.1 -U supatype_admin -q 2>/dev/null; then break; fi
            sleep 2
          done
          docker logs pg_rowcache_guard 2>&1 | grep -q "ROWCACHE_READTHROUGH needs" \
            || { echo "FAIL: the entrypoint accepted read-through with no decoder, in silence"; exit 1; }
          docker exec -e PGPASSWORD=testpassword pg_rowcache_guard \
            psql -U supatype_admin -d supatype -tA -c "SHOW pg_keyspace.rowcache_readthrough" | grep -qx off \
            || { echo "FAIL: read-through is on with no invalidation worker to make it safe"; exit 1; }
          echo "read-through without decode: warned and forced off"

      - name: Show logs on failure
        if: failure()
        run: |
          # --tail, deliberately: these run *after* the step that failed, and an unbounded dump
          # pushes the actual failure message far enough up the log that a tail no longer reaches
          # it. That cost a diagnostic cycle on this very workflow.
          # The healthcheck probe writes one FATAL every five seconds, so an unfiltered tail is
          # entirely that. Dropped here as well as fixed in the Dockerfile, because this workflow
          # also runs against images built before the fix.
          noise='database "supatype_admin" does not exist'
          for c in pg_test pg_v2 pg_keyspace_test pg_rowcache_test pg_rowcache_guard; do
            echo "--- $c"
            docker logs "$c" 2>&1 | grep -vF "$noise" | tail -40 || true
          done

      # Last, deliberately. Steps run in order and the dump above is long, so anything printed
      # before it cannot survive into a log tail — which is all that is available when a job log is
      # read back through the API. Four diagnostic cycles went into learning that.
      - name: Which assertion failed
        if: failure()
        run: |
          echo "─── row cache step progress ───"
          cat /tmp/rowcache-progress 2>/dev/null || echo "(it did not reach its first assertion)"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f pg_test pg_v1 pg_v2 pg_keyspace_test pg_rowcache_test pg_rowcache_guard || true
          docker volume rm pg_upgrade_vol || true
          exit 0

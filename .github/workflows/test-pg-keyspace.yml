name: pg_keyspace tests

# No `paths:` filter. `unit tests + extension build (PG17)` and `RESP
# conformance (daemon + redis)` are REQUIRED checks on develop, and GitHub never
# queues a workflow whose path filter does not match -- so on a PR that touches
# no pg_keyspace file those two checks sat at "Expected" forever and the PR could
# never merge. The filtering moved into the `changes` job below, which every job
# keys off, so the required checks always report while the expensive work still
# only runs when pg_keyspace actually changed.
#
# Deliberately NOT the companion `paths-ignore` workflow that GitHub's docs
# suggest: `paths-ignore` skips only when EVERY changed file matches, so a PR
# touching both pg_keyspace and anything else would run both workflows and
# produce two check runs with the same name -- one of them unconditionally
# green. A required check that can be satisfied while the real suite fails is
# worse than no check.
on:
  pull_request:
  push:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PGRX_VERSION: '0.12.9'

jobs:
  # Which half of the repository this commit touched. Fails safe: if the base
  # ref is missing or unusable (a brand-new branch, a shallow fetch), it reports
  # a change and everything runs, because skipping the suite on a guess is the
  # expensive mistake.
  changes:
    name: detect pg_keyspace changes
    runs-on: ubuntu-latest
    outputs:
      pgks: ${{ steps.filter.outputs.pgks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable base ref ($BASE); running the full suite"
            echo "pgks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(extensions/pg_keyspace/|\.github/workflows/test-pg-keyspace\.yml$)'; then
            echo "pgks=true" >> "$GITHUB_OUTPUT"
          else
            echo "pgks=false" >> "$GITHUB_OUTPUT"
          fi

  # Job 1 (highest priority): fast, self-contained. Rust unit tests need no
  # Postgres; the extension build catches compile breaks in the pgrx crate.
  unit-and-build:
    name: unit tests + extension build (PG${{ matrix.pg }})
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        pg: [17]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.pgks == 'true'

      - name: Cache cargo
        if: needs.changes.outputs.pgks == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            extensions/pg_keyspace/core/target
            extensions/pg_keyspace/extension/target
          key: pgks-cargo-${{ runner.os }}-pg${{ matrix.pg }}-${{ hashFiles('extensions/pg_keyspace/**/Cargo.lock') }}

      # ---- core unit tests: pure Rust, no Postgres needed --------------------
      - name: Unit tests (core)
        if: needs.changes.outputs.pgks == 'true'
        working-directory: extensions/pg_keyspace/core
        run: cargo test --locked

      # ---- extension build: needs PG17 headers + libclang (pgrx bindgen) -----
      - name: Add the PostgreSQL apt repository
        if: needs.changes.outputs.pgks == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

      - name: Install PostgreSQL ${{ matrix.pg }} + build deps
        if: needs.changes.outputs.pgks == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            clang libclang-dev llvm-dev

      - name: Install cargo-pgrx ${{ env.PGRX_VERSION }}
        if: needs.changes.outputs.pgks == 'true'
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked

      - name: Initialise pgrx against the system PostgreSQL ${{ matrix.pg }}
        if: needs.changes.outputs.pgks == 'true'
        run: cargo pgrx init --pg${{ matrix.pg }} /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Build the extension (compile check)
        if: needs.changes.outputs.pgks == 'true'
        working-directory: extensions/pg_keyspace/extension
        run: cargo build --locked --no-default-features --features pg${{ matrix.pg }}

      - name: pg_keyspace untouched
        if: needs.changes.outputs.pgks != 'true'
        run: |
          echo "No file under extensions/pg_keyspace/ changed in this commit."
          echo "The suite has nothing to test; reporting success so this"
          echo "required check does not block the pull request."

  # Job 2: RESP conformance + integration. Drives the standalone daemon and a
  # real redis-server the way the bench harnesses do — no Postgres required.
  integration:
    name: RESP conformance (daemon + redis)
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.pgks == 'true'

      - name: Cache cargo
        if: needs.changes.outputs.pgks == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            extensions/pg_keyspace/core/target
          key: pgks-core-${{ runner.os }}-${{ hashFiles('extensions/pg_keyspace/core/Cargo.lock') }}

      - name: Install redis (server + tools)
        if: needs.changes.outputs.pgks == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends redis-server redis-tools

      - name: Build daemon + standby binaries
        if: needs.changes.outputs.pgks == 'true'
        working-directory: extensions/pg_keyspace/core
        run: cargo build --locked --release --bins

      - name: Start redis (reference for parity checks)
        if: needs.changes.outputs.pgks == 'true'
        run: |
          redis-server --port 6379 --daemonize yes --save '' --appendonly no
          for _ in $(seq 1 20); do redis-cli -p 6379 PING 2>/dev/null | grep -q PONG && break; sleep 0.2; done
          redis-cli -p 6379 PING

      - name: Start redis 8 (bloom/cuckoo parity reference)
        if: needs.changes.outputs.pgks == 'true'
        run: |
          docker run --rm -d --name redis8 -p 6380:6379 redis:8.10.1
          for _ in $(seq 1 30); do redis-cli -p 6380 PING 2>/dev/null | grep -q PONG && break; sleep 0.5; done
          redis-cli -p 6380 PING

      - name: Run conformance + integration benches
        if: needs.changes.outputs.pgks == 'true'
        working-directory: extensions/pg_keyspace
        env:
          DAEMON: ${{ github.workspace }}/extensions/pg_keyspace/core/target/release/pgkeyspaced
          REPLICA: ${{ github.workspace }}/extensions/pg_keyspace/core/target/release/pgks-replica
        run: |
          set -u
          fail=0
          runbench() {           # runbench <script> [env assignments...]
            local script="$1"; shift
            echo "::group::$script"
            if env "$@" bash "bench/$script"; then echo "OK  $script";
            else echo "FAIL $script"; fail=1; fi
            echo "::endgroup::"
          }

          # Self-contained: each starts its own daemon (and standby) and cleans up.
          runbench run_replication.sh
          runbench run_bighash.sh
          runbench run_biglist.sh
          runbench run_bigzset.sh
          runbench run_pubsub_xworker.sh
          runbench run_tracking_xworker.sh

          # Type conformance + WRONGTYPE + redis parity, against one daemon.
          "$DAEMON" --workers 1 --port 6400 --keys-per-worker 200000 --shmem-mb 128 \
            >/tmp/pgks_ci_daemon.log 2>&1 &
          dpid=$!
          for _ in $(seq 1 30); do redis-cli -p 6400 PING 2>/dev/null | grep -q PONG && break; sleep 0.2; done
          for s in run_hashes.sh run_lists.sh run_zsets.sh run_pubsub.sh run_ttl_scan.sh run_strings.sh run_bitmaps.sh run_keys_admin.sh run_aggr_gaps.sh run_sets.sh run_scans.sh run_zset_ops.sh run_txn.sh run_resp3.sh run_bloom.sh run_cuckoo.sh; do
            runbench "$s" RESP=6400 REDIS8=6380
          done
          kill $dpid 2>/dev/null || true

          echo "===================================="
          [ "$fail" -eq 0 ] && echo "all benches passed" || echo "some benches FAILED"
          exit $fail

      - name: pg_keyspace untouched
        if: needs.changes.outputs.pgks != 'true'
        run: |
          echo "No file under extensions/pg_keyspace/ changed in this commit."
          echo "The suite has nothing to test; reporting success so this"
          echo "required check does not block the pull request."

  # Job 3: macOS. Proves the readiness loop builds and runs on kqueue (mio's
  # macOS backend) and the cross-worker wake self-pipe works, so the darwin
  # native archive can bundle pg_keyspace. No Postgres — just the core crate,
  # the daemon, and the RESP/cross-worker conformance harnesses.
  macos:
    name: macOS build + kqueue event loop
    runs-on: macos-14
    needs: changes
    if: needs.changes.outputs.pgks == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            extensions/pg_keyspace/core/target
          key: pgks-macos-${{ hashFiles('extensions/pg_keyspace/core/Cargo.lock') }}

      - name: Install redis + GNU coreutils
        # The bench harnesses are shared with the Linux jobs and assume a GNU
        # userland — `timeout` (absent on macOS) and `paste`/`sort` reading
        # stdin. coreutils provides them; put its gnubin dir (unprefixed GNU
        # tools) first on PATH so the scripts run unchanged. This only affects
        # the test harness — the daemon under test is native macOS (kqueue).
        run: |
          brew install redis coreutils
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      # ---- core unit tests: pure Rust, exercises the macOS build -------------
      - name: Unit tests (core)
        working-directory: extensions/pg_keyspace/core
        run: cargo test --locked

      - name: Build daemon (release)
        working-directory: extensions/pg_keyspace/core
        run: cargo build --locked --release --bin pgkeyspaced

      - name: RESP + cross-worker conformance (kqueue)
        working-directory: extensions/pg_keyspace
        env:
          DAEMON: ${{ github.workspace }}/extensions/pg_keyspace/core/target/release/pgkeyspaced
        run: |
          set -u
          fail=0
          runbench() {           # runbench <script> [env assignments...]
            local script="$1"; shift
            echo "::group::$script"
            if env "$@" bash "bench/$script"; then echo "OK  $script";
            else echo "FAIL $script"; fail=1; fi
            echo "::endgroup::"
          }

          # Cross-worker paths drive the Bus wake fd through kqueue (self-pipe).
          runbench run_pubsub_xworker.sh
          runbench run_tracking_xworker.sh

          # Protocol + a representative slice of the type surface, one daemon.
          "$DAEMON" --workers 1 --port 6400 --keys-per-worker 200000 --shmem-mb 128 \
            >/tmp/pgks_ci_daemon.log 2>&1 &
          dpid=$!
          for _ in $(seq 1 30); do redis-cli -p 6400 PING 2>/dev/null | grep -q PONG && break; sleep 0.2; done
          for s in run_resp3.sh run_hashes.sh run_lists.sh run_zsets.sh run_sets.sh run_bitmaps.sh run_ttl_scan.sh run_pubsub.sh run_txn.sh run_bloom.sh run_cuckoo.sh; do
            runbench "$s" RESP=6400
          done
          kill $dpid 2>/dev/null || true

          echo "===================================="
          [ "$fail" -eq 0 ] && echo "all benches passed" || echo "some benches FAILED"
          exit $fail

  # Job 3: the in-Postgres durability suite. The other jobs drive the
  # standalone daemon, so every in-process path (persistence tiers, crash
  # recovery, the large-value reference path, slab reclamation, the replicated
  # tier's startup refusal) ran nowhere in CI. This installs the extension into
  # a real PostgreSQL and exercises them, including injected failures.
  #
  # A debug build is deliberate: the release profile uses thin LTO with one
  # codegen unit and takes upwards of ten minutes. Correctness here does not
  # need the optimiser; the release build is covered by the packaging jobs.
  durability-in-postgres:
    name: durability + fault injection (in PG${{ matrix.pg }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.pgks == 'true'
    strategy:
      fail-fast: false
      matrix:
        pg: [17]
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            extensions/pg_keyspace/extension/target
          key: pgks-durability-${{ runner.os }}-pg${{ matrix.pg }}-${{ hashFiles('extensions/pg_keyspace/**/Cargo.lock') }}

      - name: Add the PostgreSQL apt repository
        run: |
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

      - name: Install PostgreSQL ${{ matrix.pg }} + build deps + redis-cli
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            clang libclang-dev llvm-dev redis-tools

      - name: Install cargo-pgrx ${{ env.PGRX_VERSION }}
        run: cargo install cargo-pgrx --version "$PGRX_VERSION" --locked

      - name: Initialise pgrx against the system PostgreSQL ${{ matrix.pg }}
        run: cargo pgrx init --pg${{ matrix.pg }} /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      # The runner's own cluster would collide on the data directory and port.
      - name: Stop any preinstalled PostgreSQL
        run: sudo systemctl stop postgresql || true

      # Correctness, not measurement: 20 boolean assertions about which
      # certificate the RESP port serves, checked on the wire. Runs before the
      # long suite so a TLS regression is reported in a couple of minutes
      # rather than after twenty. Its own cluster, its own ports.
      - name: RESP TLS certificate inheritance
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_tls_inherit.sh

      # Correctness: a registration must survive a segment reinitialisation.
      # Its own cluster and ports, and it needs the C output plugin, which it
      # builds itself.
      # Correctness across a database boundary: two databases cloned from one
      # template (so their relids match) must never see each other's cached
      # rows. Its own cluster and ports; builds the C output plugin itself.
      # Sets the system clock, so it needs CAP_SYS_TIME. It SKIPS rather than
      # fails where the clock cannot be set — a test that silently does nothing
      # is worse than one that says it did nothing. The arithmetic is covered by
      # the store::tests::*clock* unit tests either way.
      - name: TTL survives a wall-clock step
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_ttl_clock_step.sh

      - name: Row-cache database scoping
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_rowcache_database_scope.sh

      - name: Row-cache registration durability
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_rowcache_registration.sh

      # The claim that your existing Postgres backups already cover the cache
      # (#112). Restores a base backup to a timestamp mid-traffic and asserts
      # the boundary in both directions: everything acknowledged before the
      # target comes back, nothing written after it does, and the table the
      # cache fronts stopped at the same instant. Its own clusters and ports.
      # Every pg_keyspace worker asks for SPI, so pgrx registers it with
      # BgWorkerStartTime::RecoveryFinished -- and on a streaming standby
      # recovery never finishes, so none of them ever start. Nothing errors.
      # This asserts the cluster says so, that the notice is true (the RESP port
      # really does not answer), and that the deferral lifts by itself on
      # promotion. Its own clusters and ports.
      - name: A standby says its workers are deferred, and serves after promotion
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_standby_notice.sh

      # supacache.publish() from SQL, across three worker PROCESSES -- the case
      # that would silently deliver nothing if the external lane were wrong.
      # Includes the security assertion: the superuser restriction must survive
      # an operator granting USAGE and EXECUTE, because it lives in the function
      # rather than in a GRANT. Its own cluster and ports.
      - name: SQL publish reaches RESP subscribers
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_sql_publish.sh

      # PUBSUB introspection on a multi-worker, authenticated cluster: the two
      # things the conformance harness cannot show, because it runs one worker
      # with no auth. That the answer covers the instance rather than whichever
      # worker was asked, and that it does not enumerate another tenant's
      # channels. Its own cluster and ports.
      - name: PUBSUB is instance-wide and tenant-scoped
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_pubsub_introspect.sh

      - name: pg_basebackup + PITR restores the cache
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_pitr_restore.sh

      - name: Probabilistic filter durability
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_prob_durability_pg.sh

      # Observability: the pg_stat_*-shaped views a monitoring stack collects
      # from. Asserts the grants against a live pg_monitor member rather than
      # describing them, including the negative control that a role WITHOUT
      # pg_monitor is refused. Its own cluster and ports; builds the C output
      # plugin itself.
      - name: Operational metrics views
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_pg_stat_views.sh

      # Two whole-cluster segfaults, both in the Mode B row cache: a query with
      # no WHERE clause dereferencing a null baserestrictinfo at plan time
      # (#128), and concurrent backends writing one unsynchronised arena under
      # read-through (#127). Both reproduce in seconds, so this is cheap and it
      # is the one test that fails loudly if either comes back.
      - name: Extension upgrade path (0.1.0 -> 0.2.0)
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_extension_upgrade.sh

      - name: Extension catalogue self-upgrade
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_extension_autoupgrade.sh

      - name: Row-cache crash regressions
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_rowcache_concurrency.sh

      # The row cache in EVERY database (#120). Three databases cloned from one
      # template so their relids collide, each registered, each with its own
      # slot: asserts that a write in a secondary database is actually
      # invalidated (the assertion the whole issue turns on), that no database
      # is served another's rows, that a database with no registrations gets no
      # slot, and that the worker pool stays bounded by its GUC while every
      # database is still invalidated.
      - name: Row cache across databases
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_rowcache_multidb.sh

      # One slot per database means one database can pin WAL for the cluster.
      # max_slot_wal_keep_size is the mitigation, and this asserts the trade was
      # actually made: a slot the server invalidates must mark THAT database
      # incoherent, drop its cached rows, and rebuild -- never resume over the
      # gap, which would serve a stale row as truth at the moment everything
      # reports healthy again.
      - name: Row-cache slot invalidation and recovery
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_rowcache_slot_invalidation.sh

      # The #130 shape, with real entrants: concurrent registrations into
      # databases that have no catalogue yet, while a pool of workers probes the
      # same databases and races to create the same slots.
      - name: Row-cache registration and slot creation races
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_rowcache_registration_race.sh

      # The row-cache writer lock, partitioned per store partition (#120).
      # Asserts that partitioning does not reopen #127 -- a lock chosen for one
      # partition while the write lands in another is the same corruption with
      # a lock in front of it -- and that raising the partition count divides
      # the arena rather than multiplying the shared-memory request. Also
      # prints the contention numbers at 1 vs 8 partitions, which are
      # measurement rather than a gate.
      - name: Row-cache writer lock contention
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_rowcache_lock_contention.sh

      # Four persistence workers contending over TTL bucket partitions. With
      # the fix reverted this kills 44 workers in a minute; with it, none.
      - name: TTL partition creation race
        env:
          PGKS_BUILD_PROFILE: debug
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_ttl_partition_race.sh

      - name: Durability + fault injection suite
        env:
          PGKS_BUILD_PROFILE: debug
        # Root is needed to install into the PG prefix and to run initdb as the
        # postgres user, but sudo resets PATH from secure_path, so cargo (in
        # ~/.cargo/bin) disappears. PGRX_HOME has to come along too: the init
        # step above wrote it under the runner's home, not root's.
        run: |
          sudo -E env "PATH=$PATH" "PGRX_HOME=$HOME/.pgrx" \
            bash extensions/pg_keyspace/bench/run_durability_pg.sh

name: Build Native PG17 Archives

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PG_VERSION: "17.2"
  PG_TARBALL: "postgresql-17.2.tar.gz"
  PG_URL: "https://ftp.postgresql.org/pub/source/v17.2/postgresql-17.2.tar.gz"
  PG_SHA256: "51d8cdd6a5220fa8c0a3b12f2d0eeb50fcf5e0bdb7b37904a9cdff5cf1e61c36"
  INSTALL_PREFIX: "/usr/local/supatype-pg"
  # Extension versions are pinned in scripts/build-native-extensions.sh, which every native build
  # runs, so that they match the Dockerfile in one place.
  # Hetzner Object Storage, env only: configure-aws-credentials calls AWS STS.
  AWS_ACCESS_KEY_ID: ${{ secrets.CDN_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.CDN_AWS_REGION }}

jobs:
  build:
    name: Build PG17 (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-22.04
            platform: linux
            arch: amd64

          # Native ARM64 runner so pg_guard + pgvector (PGXS) compile against the
          # same staged postgres as linux-amd64 (cross-compiling those extensions was skipped).
          - target: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64

          - target: darwin-arm64
            os: macos-14
            platform: darwin
            arch: arm64

          # macos-13 retired 2025-12-04; the last Intel runner label is macos-15-intel.
          # `darwin-amd64`, matching `linux-amd64` and `windows-amd64`: the archive name comes from
          # this target, and the CLI asks for `amd64` on every platform (process.arch "x64").
          # Published as `darwin-x86_64`, the Intel macOS archive could never be found, and the CLI
          # reported "Checksum not found for supatype-pg-17-darwin-amd64".
          - target: darwin-amd64
            os: macos-15-intel
            platform: darwin
            arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ #
      # Install build dependencies
      # ------------------------------------------------------------------ #
      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          # bison and flex named rather than assumed: PostgreSQL 17's configure refuses to run
          # without them, and only the runner image happens to carry them today. libcurl for
          # pg_net; GEOS, PROJ, libxml2 and json-c for PostGIS; patchelf to point the archive at
          # the libraries bundled into it.
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bison \
            flex \
            patchelf \
            libssl-dev \
            libreadline-dev \
            zlib1g-dev \
            libicu-dev \
            libzstd-dev \
            uuid-dev \
            libcurl4-openssl-dev \
            libgeos-dev \
            libproj-dev \
            libxml2-dev \
            libjson-c-dev

      - name: Install dependencies (macOS)
        if: matrix.platform == 'darwin'
        run: |
          brew install openssl readline icu4c zstd

      - name: Set macOS Intel deployment target
        if: matrix.platform == 'darwin' && matrix.arch == 'x86_64'
        run: |
          # Xcode 16.4's SDK exposes strchrnul as macOS 15.4+, and PG17 builds
          # with -Werror=unguarded-availability-new on this runner.
          echo "MACOSX_DEPLOYMENT_TARGET=15.4" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ #
      # Download & verify PG17 source
      # ------------------------------------------------------------------ #
      - name: Download PostgreSQL ${{ env.PG_VERSION }} source
        run: |
          curl -fsSL "${{ env.PG_URL }}" -o "${{ env.PG_TARBALL }}"

      - name: Verify SHA256 checksum (Linux)
        if: matrix.platform == 'linux'
        run: |
          echo "${{ env.PG_SHA256 }}  ${{ env.PG_TARBALL }}" | sha256sum --check

      - name: Verify SHA256 checksum (macOS)
        if: matrix.platform == 'darwin'
        run: |
          echo "${{ env.PG_SHA256 }}  ${{ env.PG_TARBALL }}" | shasum -a 256 --check

      - name: Extract source
        run: |
          tar -xzf "${{ env.PG_TARBALL }}"

      # ------------------------------------------------------------------ #
      # Configure
      # ------------------------------------------------------------------ #
      - name: Configure (Linux)
        if: matrix.platform == 'linux'
        working-directory: postgresql-${{ env.PG_VERSION }}
        run: |
          ./configure \
            --prefix=${{ env.INSTALL_PREFIX }} \
            --with-openssl \
            --with-uuid=e2fs \
            --with-icu \
            --with-zstd \
            --disable-rpath

      - name: Configure (macOS)
        if: matrix.platform == 'darwin'
        working-directory: postgresql-${{ env.PG_VERSION }}
        run: |
          OPENSSL_PREFIX="$(brew --prefix openssl)"
          ICU4C_PREFIX="$(brew --prefix icu4c)"
          READLINE_PREFIX="$(brew --prefix readline)"
          ZSTD_PREFIX="$(brew --prefix zstd)"
          # icu4c (and other keg-only formulae) are not on pkg-config's default path.
          export PKG_CONFIG_PATH="${ICU4C_PREFIX}/lib/pkgconfig:${OPENSSL_PREFIX}/lib/pkgconfig:${READLINE_PREFIX}/lib/pkgconfig:${ZSTD_PREFIX}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
          ./configure \
            --prefix=${{ env.INSTALL_PREFIX }} \
            --with-openssl \
            --with-uuid=e2fs \
            --with-icu \
            --with-zstd \
            --disable-rpath \
            --with-libraries="${OPENSSL_PREFIX}/lib:${ICU4C_PREFIX}/lib:${READLINE_PREFIX}/lib:${ZSTD_PREFIX}/lib" \
            --with-includes="${OPENSSL_PREFIX}/include:${ICU4C_PREFIX}/include:${READLINE_PREFIX}/include:${ZSTD_PREFIX}/include"

      # ------------------------------------------------------------------ #
      # Build & staged install
      # ------------------------------------------------------------------ #
      - name: Build PostgreSQL
        working-directory: postgresql-${{ env.PG_VERSION }}
        run: |
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            JOBS=$(nproc)
          else
            JOBS=$(sysctl -n hw.logicalcpu)
          fi
          # `world-bin`, not the default target: the server, the client programs and contrib,
          # without the documentation. The default target leaves contrib out, and with it
          # pgcrypto, unaccent and every other module the schema engine creates. The Windows
          # archive has always been built this way.
          make -j"${JOBS}" world-bin

      - name: Install PostgreSQL (staged)
        working-directory: postgresql-${{ env.PG_VERSION }}
        run: |
          make install-world-bin DESTDIR="$(pwd)/../pg-install"

      # ------------------------------------------------------------------ #
      # Every extension below installs into the server's $libdir and extension
      # directory, which pg_config reports for the staged tree (it is relocatable).
      # The libraries used to be copied into lib/ instead, where the server never
      # looks: no bundled extension could be created, and preloading supatype_mask,
      # which the CLI does whenever the library is in the archive, stopped the
      # server starting.
      # ------------------------------------------------------------------ #
      - name: Locate the staged install
        run: |
          PG_CONFIG="$(pwd)/pg-install${{ env.INSTALL_PREFIX }}/bin/pg_config"
          {
            echo "PG_CONFIG=${PG_CONFIG}"
            echo "PKGLIBDIR=$("${PG_CONFIG}" --pkglibdir)"
            echo "EXTDIR=$("${PG_CONFIG}" --sharedir)/extension"
          } >> "$GITHUB_ENV"

      # ------------------------------------------------------------------ #
      # Build pg_guard extension (bundled in extensions/pg_guard/)
      # ------------------------------------------------------------------ #
      - name: Build and bundle pg_guard
        if: matrix.platform == 'linux' || matrix.platform == 'darwin'
        run: |
          make -C extensions/pg_guard PG_CONFIG="${PG_CONFIG}"
          make -C extensions/pg_guard install PG_CONFIG="${PG_CONFIG}"

      # ------------------------------------------------------------------ #
      # supatype_mask: per-column read masking and write rejection
      #
      # Bundled with its `.control` and SQL, not just the library: `CREATE EXTENSION`
      # needs all three, and PGXS installs them together.
      #
      # Without this, field-level access rules could not be enforced on the native
      # provider at all (the default `supatype dev`), so a schema declaring them fell
      # back to generated `api` views while the same schema on `supatype/postgres` used
      # the planner rewrite. Same source, two mechanisms, purely because of packaging.
      # ------------------------------------------------------------------ #
      - name: Build and bundle supatype_mask
        if: matrix.platform == 'linux' || matrix.platform == 'darwin'
        run: |
          # PG_CONFIG on `clean` too: a PGXS makefile resolves `$(PG_CONFIG) --pgxs` for every target,
          # so `clean` without it fails with "make: pg_config: No such file or directory" wherever the
          # runner image carries no system PostgreSQL, which is every platform here except
          # linux-amd64, the one that passed and made this look platform-specific.
          make -C extensions/supatype_mask clean PG_CONFIG="${PG_CONFIG}"
          make -C extensions/supatype_mask PG_CONFIG="${PG_CONFIG}"
          make -C extensions/supatype_mask install PG_CONFIG="${PG_CONFIG}"

      # ------------------------------------------------------------------ #
      # Upstream extensions: pgvector, wal2json, pg_cron, pg_net, pg_safeupdate,
      # pg_plan_filter, pgjwt and (Linux) PostGIS. Pinned in the script, which
      # the local builds run too, so there is one list of native versions.
      # ------------------------------------------------------------------ #
      - name: Build and bundle the upstream extensions
        if: matrix.platform == 'linux' || matrix.platform == 'darwin'
        env:
          BUILD_DIR: ${{ runner.temp }}
        run: bash scripts/build-native-extensions.sh "${PG_CONFIG}" "${{ matrix.platform }}"

      # ------------------------------------------------------------------ #
      # pg_keyspace: Postgres-native RESP keyspace + PostgREST row cache
      # (Rust/pgrx). Built from in-repo source against the staged PG so the
      # native archive ships the same extension as the supatype/postgres image.
      #
      # LINUX + macOS. pg_keyspace's event loop is readiness-driven via mio
      # (epoll on Linux, kqueue on macOS), so it builds on both. Windows is still
      # excluded, because pgrx has no supported Windows target, so that archive ships
      # the other extensions but not pg_keyspace.
      # ------------------------------------------------------------------ #
      - name: Install clang for pgrx bindgen (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y --no-install-recommends clang libclang-dev llvm-dev
        # macOS runners already ship clang/libclang with the Xcode command-line
        # tools, so no extra install step is needed there.

      - name: Install cargo-pgrx
        if: matrix.platform == 'linux' || matrix.platform == 'darwin'
        run: cargo install cargo-pgrx --version 0.12.9 --locked

      - name: Build and bundle pg_keyspace
        if: matrix.platform == 'linux' || matrix.platform == 'darwin'
        run: |
          set -euo pipefail

          # `cargo pgrx package` builds against --pg-config directly, but it still
          # requires PGRX_HOME to exist ("$PGRX_HOME does not exist" otherwise).
          # We must NOT create it with `cargo pgrx init`: init runs initdb, which
          # fails against a staged (DESTDIR) Postgres whose binaries resolve libpq
          # at an absolute install prefix that isn't installed yet (the macOS
          # "Library not loaded: .../libpq.5.dylib" failure). So build a minimal
          # PGRX_HOME that registers pg17 -> this pg_config, with no initdb involved.
          export PGRX_HOME="${HOME}/.pgrx"
          mkdir -p "${PGRX_HOME}"
          printf '[configs]\npg17 = "%s"\n' "${PG_CONFIG}" > "${PGRX_HOME}/config.toml"
          ( cd extensions/pg_keyspace/extension && cargo pgrx package --pg-config "${PG_CONFIG}" )

          # pgrx lays the package tree under target/release/pg_keyspace-pg17 at the
          # paths pg_config REPORTS. PostgreSQL's pg_config is relocatable, so for a
          # staged build those are the pg-install/... paths, not ${INSTALL_PREFIX}, so
          # derive them from pg_config rather than assuming the prefix.
          PKGROOT="extensions/pg_keyspace/extension/target/release/pg_keyspace-pg17"
          LIBSRC="${PKGROOT}${PKGLIBDIR}"
          SHARESRC="${PKGROOT}${EXTDIR}"
          find "${LIBSRC}" \( -name "pg_keyspace.so" -o -name "pg_keyspace.dylib" \) \
            -exec cp {} "${PKGLIBDIR}/" \;
          cp "${SHARESRC}/pg_keyspace.control" "${EXTDIR}/"
          cp "${SHARESRC}"/pg_keyspace--*.sql "${EXTDIR}/"

          # keys-only logical-decode plugin (Mode B row cache), beside the extension.
          make -C extensions/pg_keyspace/plugin clean PG_CONFIG="${PG_CONFIG}" || true
          make -C extensions/pg_keyspace/plugin PG_CONFIG="${PG_CONFIG}"
          make -C extensions/pg_keyspace/plugin install PG_CONFIG="${PG_CONFIG}"

      # ------------------------------------------------------------------ #
      # Copy every library the archive loads, other than glibc and the C++
      # runtime, into lib/ and give every ELF file a RUNPATH to it, so the
      # archive starts on distributions other than the runner's. It used to need
      # the runner's libicu70 and libreadline8, and did not start on Fedora 40.
      # ------------------------------------------------------------------ #
      - name: Bundle shared libraries (Linux)
        if: matrix.platform == 'linux'
        run: bash scripts/bundle-linux-libraries.sh "pg-install${{ env.INSTALL_PREFIX }}"

      # ------------------------------------------------------------------ #
      # Start the staged tree the way native `supatype dev` does: every library
      # the image preloads, wal_level=logical, every extension it creates, and a
      # wal2json round trip. Linux only for now: the macOS archive has not been
      # run through it yet.
      # ------------------------------------------------------------------ #
      - name: Start the archive and check what native dev needs (Linux)
        if: matrix.platform == 'linux'
        run: bash tests/native-archive/check-unix-runtime.sh "pg-install${{ env.INSTALL_PREFIX }}" 55432

      # ------------------------------------------------------------------ #
      # macOS: Developer ID + notarization (Phase 10.6 B7; same secrets as server-release)
      # ------------------------------------------------------------------ #
      - name: Sign staged Postgres tree (macOS)
        if: matrix.platform == 'darwin'
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERT_BASE64:-}" ]; then
            echo "::notice::APPLE_CERT_BASE64 unset, skipping macOS codesign for Postgres bundle."
            exit 0
          fi
          ROOT="$(pwd)/pg-install${{ env.INSTALL_PREFIX }}"
          echo "$APPLE_CERT_BASE64" | base64 --decode > cert.p12
          security create-keychain -p ci-keychain ci.keychain
          security import cert.p12 -k ci.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-keychain-settings -t 3600 -u ci.keychain
          security unlock-keychain -p ci-keychain ci.keychain
          # Split on purpose: each existing keychain is its own argument after ci.keychain.
          # shellcheck disable=SC2046
          security list-keychains -d user -s ci.keychain $(security list-keychains -d user | sed 's/\"//g')
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-keychain ci.keychain
          SIGN_ID="Developer ID Application: Supatype Inc (${APPLE_TEAM_ID})"
          find "$ROOT" -type f ! -name "*.sql" ! -name "*.txt" ! -name "*.sample" | while IFS= read -r f; do
            case "$(file -b "$f" 2>/dev/null)" in
              Mach-O*)
                codesign --sign "$SIGN_ID" --options runtime --timestamp --force "$f"
                ;;
            esac
          done
          rm -f cert.p12

      # ------------------------------------------------------------------ #
      # Package archive
      # ------------------------------------------------------------------ #
      - name: Create archive
        run: |
          FILENAME="supatype-pg-17-${{ matrix.target }}.tar.gz"
          tar -czf "${FILENAME}" -C pg-install${{ env.INSTALL_PREFIX }} .
          echo "ARCHIVE_NAME=${FILENAME}" >> "$GITHUB_ENV"

      - name: Notarize Postgres archive (macOS)
        if: matrix.platform == 'darwin'
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_NOTARY_APPLE_ID:-}" ] || [ -z "${APPLE_NOTARY_PASSWORD:-}" ]; then
            echo "::notice::Apple notary secrets unset, skipping notarization for Postgres bundle."
            exit 0
          fi
          ARCH="${{ env.ARCHIVE_NAME }}"
          zip -j "${ARCH}.notary.zip" "${ARCH}"
          xcrun notarytool submit "${ARCH}.notary.zip" \
            --apple-id "$APPLE_NOTARY_APPLE_ID" \
            --password "$APPLE_NOTARY_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 20m
          rm -f "${ARCH}.notary.zip"

      - name: Generate checksum (Linux)
        if: matrix.platform == 'linux'
        run: |
          sha256sum "${{ env.ARCHIVE_NAME }}" > "${{ env.ARCHIVE_NAME }}.sha256"

      - name: Generate checksum (macOS)
        if: matrix.platform == 'darwin'
        run: |
          shasum -a 256 "${{ env.ARCHIVE_NAME }}" > "${{ env.ARCHIVE_NAME }}.sha256"

      # ------------------------------------------------------------------ #
      # Upload artifact for release job
      # ------------------------------------------------------------------ #
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: supatype-pg-17-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          retention-days: 7

  # -------------------------------------------------------------------- #
  # Windows: MSYS2/MINGW64. PostgreSQL is built from the same pinned source
  # as the Linux and macOS archives, with the extensions compiled via PGXS,
  # by scripts/build-native-windows.sh (the local build runs the same
  # script). It used to install MSYS2's prebuilt PostgreSQL package, whose
  # libraries drifted from the rolling repository until the archive could
  # not start, and which MSYS2 has since deleted.
  # -------------------------------------------------------------------- #
  build-windows:
    name: Build PG17 + extensions (windows-amd64)
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-icu
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-readline
            mingw-w64-x86_64-geos
            mingw-w64-x86_64-proj
            mingw-w64-x86_64-json-c
            mingw-w64-x86_64-libxml2
            make
            bison
            flex
            diffutils
            perl
            git
            curl
            tar

      # PG_VERSION and PG_SHA256 come from the workflow env; the extension pins live in
      # scripts/build-native-extensions.sh.
      # The script fails when any program or library in the tree cannot load.
      - name: Build PostgreSQL ${{ env.PG_VERSION }} and extensions
        run: bash scripts/build-native-windows.sh staging

      # The tree is started with only the Windows system directories on PATH, so a DLL it lacks
      # cannot be found in MSYS2 instead and hide the gap, as it would on any build machine.
      - name: Start the archive and create its extensions
        run: bash tests/native-archive/check-windows-runtime.sh staging 55432

      # ------------------------------------------------------------------ #
      # Package
      # ------------------------------------------------------------------ #
      - name: Create zip archive
        shell: pwsh
        run: |
          $archiveName = "supatype-pg-17-windows-amd64.zip"
          Compress-Archive -Path "staging\*" -DestinationPath $archiveName
          "ARCHIVE_NAME=$archiveName" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "$env:ARCHIVE_NAME" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ARCHIVE_NAME" | Out-File -Encoding ascii "$env:ARCHIVE_NAME.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: supatype-pg-17-windows-amd64
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          retention-days: 7

  # -------------------------------------------------------------------- #
  # pg_keyspace: standalone installable packages (.deb + portable .tar.gz),
  # the way pgrx extensions are normally distributed (cf. pg_graphql). These
  # target a stock PGDG PostgreSQL 17 (prefix /usr/lib/postgresql/17) so anyone
  # can `dpkg -i` or untar them onto their own Postgres, separate from the
  # full-Postgres native archives above. Attached to the same release below.
  # -------------------------------------------------------------------- #
  pg-keyspace-package:
    name: Package pg_keyspace (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the PostgreSQL apt repository
        run: |
          sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

      - name: Install PostgreSQL 17 + build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            postgresql-17 postgresql-server-dev-17 \
            clang libclang-dev llvm-dev build-essential

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version 0.12.9 --locked

      - name: Initialise pgrx against the packaged PG17
        run: cargo pgrx init --pg17 /usr/lib/postgresql/17/bin/pg_config

      - name: Package the extension (.so + .control + .sql)
        working-directory: extensions/pg_keyspace/extension
        run: cargo pgrx package --pg-config /usr/lib/postgresql/17/bin/pg_config

      - name: Build the keys-only decode plugin
        working-directory: extensions/pg_keyspace/plugin
        run: make PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config

      - name: Resolve version
        id: v
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble .deb and tarball
        id: pkg
        working-directory: extensions/pg_keyspace
        run: |
          set -eu
          VER="${{ steps.v.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PKGLIBDIR="$(/usr/lib/postgresql/17/bin/pg_config --pkglibdir)"

          ROOT="$(mktemp -d)"
          # pgrx package tree is already rooted at usr/...
          cp -a extension/target/release/pg_keyspace-pg17/usr "$ROOT/"
          # add the decode plugin next to the extension .so
          install -Dm755 plugin/supacache_keys.so "$ROOT${PKGLIBDIR}/supacache_keys.so"

          NAME="pg_keyspace-v${VER}-pg17-${ARCH}-linux-gnu"
          tar czf "${GITHUB_WORKSPACE}/${NAME}.tar.gz" -C "$ROOT" usr

          mkdir -p "$ROOT/DEBIAN"
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: pg-keyspace
          Version: ${VER}
          Architecture: ${ARCH}
          Maintainer: Supatype <nic@titanacademy.io>
          Depends: postgresql-17
          Section: database
          Priority: optional
          Homepage: https://github.com/${{ github.repository }}
          Description: Postgres-native RESP (Redis-compatible) keyspace + PostgREST row cache
           A background-worker RESP2 server over a shared-memory keyspace, plus a
           transparent row cache. Runs standalone; optional supatype_mask integration.
          EOF
          dpkg-deb --build --root-owner-group "$ROOT" "${GITHUB_WORKSPACE}/${NAME}.deb"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pg-keyspace-pkg-${{ matrix.arch }}
          path: |
            ${{ steps.pkg.outputs.name }}.deb
            ${{ steps.pkg.outputs.name }}.tar.gz
          retention-days: 7

  # -------------------------------------------------------------------- #
  # Upload archives to CDN from one Linux runner.  This avoids parallel
  # multipart uploads from every build runner against Hetzner Object Storage
  # while keeping multipart enabled for large Postgres archives.
  # -------------------------------------------------------------------- #
  publish-cdn:
    name: Upload PG17 archives to CDN
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CDN_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.CDN_AWS_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      # The tag is the release, not `PG_VERSION`, which is the PostgreSQL source version, and two
      # releases of the same source (17.2.1, 17.2.2) would otherwise publish into the same
      # directory. Objects are uploaded `immutable, max-age=1y`, so overwriting one leaves caches
      # serving a fresh checksums file beside a stale archive until the year is out.
      - name: Resolve the release version
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::This job publishes immutable release artefacts and must run from a tag."
            exit 1
          fi
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          pattern: supatype-pg-17-*
          merge-multiple: true

      - name: Upload archives to CDN
        run: |
          set -euo pipefail

          # Hetzner: bare regional endpoint only, e.g. https://nbg1.your-objectstorage.com
          EP="${{ secrets.CDN_ENDPOINT }}"
          EP="${EP%/}"
          BUCKET="${{ secrets.CDN_BUCKET }}"
          BASE="s3://${BUCKET}/postgres/v${RELEASE_VERSION}"
          CACHE_CONTROL="public, max-age=31536000, immutable"

          if [[ "${EP}" == *"/${BUCKET}"* ]] || [[ "${EP}" == *"/${BUCKET}/"* ]]; then
            echo "::error::CDN_ENDPOINT must be the regional host only (https://nbg1.your-objectstorage.com), not include the bucket."
            exit 1
          fi

          export AWS_RETRY_MODE=standard
          export AWS_MAX_ATTEMPTS=10
          aws configure set default.s3.addressing_style path
          aws configure set default.s3.signature_version s3v4
          aws configure set default.s3.multipart_threshold 64MB
          aws configure set default.s3.multipart_chunksize 64MB
          aws configure set default.s3.max_concurrent_requests 1

          echo "Preflight: Hetzner bucket access"
          aws s3 ls "s3://${BUCKET}/" --endpoint-url "${EP}"

          upload_file() {
            local body="$1"
            local destination="$2"
            local attempt delay

            for attempt in 1 2 3 4 5; do
              if aws s3 cp "${body}" "${destination}" \
                --endpoint-url "${EP}" \
                --cache-control "${CACHE_CONTROL}" \
                --cli-connect-timeout 120 \
                --cli-read-timeout 1200 \
                --no-progress; then
                return 0
              fi

              if [[ "${attempt}" == "5" ]]; then
                echo "::error::Upload failed after ${attempt} attempts: ${body} -> ${destination}"
                return 1
              fi

              delay=$((attempt * attempt * 5))
              echo "::warning::Upload attempt ${attempt} failed for ${body}; retrying in ${delay}s"
              sleep "${delay}"
            done
          }

          for artifact in supatype-pg-17-*; do
            if [[ -f "${artifact}" ]]; then
              upload_file "${artifact}" "${BASE}/${artifact}"
            fi
          done

  # -------------------------------------------------------------------- #
  # Sign combined checksums, update latest.json, attach to GitHub Release
  # -------------------------------------------------------------------- #
  release:
    name: Sign, Update CDN & Release
    needs: [publish-cdn, pg-keyspace-package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CDN_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.CDN_AWS_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"

    steps:
      # The tag is the release, with its leading `v` stripped: `github.ref_name` is `v17.2.3` and
      # the CDN path is `postgres/v<version>`, so using it raw publishes to `postgres/vv17.2.3`.
      - name: Resolve the release version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: supatype-pg-17-*
          merge-multiple: true

      - name: Download pg_keyspace packages
        uses: actions/download-artifact@v4
        with:
          pattern: pg-keyspace-pkg-*
          merge-multiple: true

      # Only the full-Postgres native archives go into the signed/minisigned
      # manifest the CLI verifies; the standalone pg_keyspace packages are
      # attached to the Release below but kept out of this manifest.
      - name: Generate combined checksums.sha256
        run: |
          sha256sum supatype-pg-17-*.tar.gz supatype-pg-17-*.zip > checksums.sha256
          cat checksums.sha256

      - name: Install minisign
        run: sudo apt-get install -y minisign

      - name: Sign checksums.sha256
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          printf '%s' "$MINISIGN_PRIVATE_KEY" > /tmp/minisign.key
          echo "$MINISIGN_PASSWORD" | minisign \
            -S -s /tmp/minisign.key \
            -m checksums.sha256 \
            -t "supatype postgres releases ${{ github.ref_name }}"
          rm -f /tmp/minisign.key

      - name: Upload checksums + signature to CDN
        run: |
          set -euo pipefail

          EP="${{ secrets.CDN_ENDPOINT }}"
          EP="${EP%/}"
          BUCKET="${{ secrets.CDN_BUCKET }}"
          BASE="s3://${BUCKET}/postgres/v${RELEASE_VERSION}"
          CACHE_CONTROL="public, max-age=31536000, immutable"
          export AWS_RETRY_MODE=standard
          export AWS_MAX_ATTEMPTS=10
          aws configure set default.s3.addressing_style path
          aws configure set default.s3.signature_version s3v4
          aws configure set default.s3.multipart_threshold 64MB
          aws configure set default.s3.multipart_chunksize 64MB
          aws configure set default.s3.max_concurrent_requests 1

          upload_file() {
            local body="$1"
            local destination="$2"
            local attempt delay

            for attempt in 1 2 3 4 5; do
              if aws s3 cp "${body}" "${destination}" \
                --endpoint-url "${EP}" \
                --cache-control "${CACHE_CONTROL}" \
                --cli-connect-timeout 120 \
                --cli-read-timeout 1200 \
                --no-progress; then
                return 0
              fi

              if [[ "${attempt}" == "5" ]]; then
                echo "::error::Upload failed after ${attempt} attempts: ${body} -> ${destination}"
                return 1
              fi

              delay=$((attempt * attempt * 5))
              echo "::warning::Upload attempt ${attempt} failed for ${body}; retrying in ${delay}s"
              sleep "${delay}"
            done
          }

          upload_file checksums.sha256 "${BASE}/checksums.sha256"
          upload_file checksums.sha256.minisig "${BASE}/checksums.sha256.minisig"

      - name: Update postgres/latest.json
        run: |
          set -euo pipefail

          EP="${{ secrets.CDN_ENDPOINT }}"
          EP="${EP%/}"
          BUCKET="${{ secrets.CDN_BUCKET }}"
          export AWS_RETRY_MODE=standard
          export AWS_MAX_ATTEMPTS=10
          aws configure set default.s3.addressing_style path
          aws configure set default.s3.signature_version s3v4
          aws configure set default.s3.multipart_threshold 64MB
          aws configure set default.s3.multipart_chunksize 64MB
          aws configure set default.s3.max_concurrent_requests 1

          # `.com`, not `.io`: the CLI builds its own URL today, so this field is documentation,
          # and documentation pointing at a host we do not serve is worse than none.
          printf '{"version":"%s","date":"%s","checksums_url":"https://releases.supatype.com/postgres/v%s/checksums.sha256"}\n' \
            "${RELEASE_VERSION}" "$(date -u +%Y-%m-%d)" "${RELEASE_VERSION}" > latest.json

          for attempt in 1 2 3 4 5; do
            if aws s3 cp latest.json \
              "s3://${BUCKET}/postgres/latest.json" \
              --endpoint-url "${EP}" \
              --cache-control "no-cache, no-store, must-revalidate" \
              --cli-connect-timeout 120 \
              --cli-read-timeout 1200 \
              --no-progress; then
              break
            fi

            if [[ "${attempt}" == "5" ]]; then
              echo "::error::Upload failed after ${attempt} attempts: latest.json -> s3://${BUCKET}/postgres/latest.json"
              exit 1
            fi

            delay=$((attempt * attempt * 5))
            echo "::warning::Upload attempt ${attempt} failed for latest.json; retrying in ${delay}s"
            sleep "${delay}"
          done

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            supatype-pg-17-*.tar.gz
            supatype-pg-17-*.tar.gz.sha256
            supatype-pg-17-*.zip
            supatype-pg-17-*.zip.sha256
            checksums.sha256
            checksums.sha256.minisig
            pg_keyspace-v*-pg17-*-linux-gnu.deb
            pg_keyspace-v*-pg17-*-linux-gnu.tar.gz

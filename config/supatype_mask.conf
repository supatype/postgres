# Roles that read masked columns unmasked.
#
# Exactly the escape hatch the access rules already exempt, and nothing else. In
# particular not `authenticator` and not the table owner: PostgREST connects as one of
# them, and exempting either would make masking a no-op for the entire data plane.
#
# `supatype_sql_editor` is the role the Studio SQL editor connects as (SEC-SQL). The editor
# has always seen past masking, because it used to connect as a superuser; now that it
# connects as a non-superuser, it has to be named here to keep that. It is a LOGIN role used
# only by the editor, never by the data plane, so exempting it does not weaken masking for
# PostgREST or anyone else.
supatype_mask.exempt_roles = 'service_role,supatype_sql_editor'

# Both of this extension's settings are PGC_SIGHUP, so they can only be changed here and
# reloaded -- there is no `SET`, `ALTER ROLE` or `ALTER DATABASE` that reaches them, for
# any role including superusers. Same posture pg_guard takes with its own settings, and for
# the same reason: dropping a label is drift the differ reports on the next push, whereas a
# GUC flipped onto the data-plane role would unmask everything silently and permanently.
#
# Break-glass, deliberately requiring a file edit and a reload:
# supatype_mask.enabled = off

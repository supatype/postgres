; PgBouncer Transaction Pool Configuration
; Port 6432 — internal only, used by PostgREST, GoTrue, and Supatype services
; Connections returned to pool after each transaction

[databases]
shared = host=postgres port=5432 dbname=shared

[pgbouncer]
; Transaction pool mode
pool_mode = transaction
listen_port = 6432
listen_addr = 127.0.0.1

; Internal only — no TLS needed (pod-to-pod within cluster)
; Uncomment for external access:
; client_tls_sslmode = require

; Pool sizing (shared across all projects)
default_pool_size = 20
max_client_conn = 1000
max_db_connections = 200

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Performance
server_reset_query = DISCARD ALL
server_check_delay = 10
server_lifetime = 3600

; Logging
log_connections = 0
log_disconnections = 0
stats_period = 60

# pg_keyspace — Postgres-native RESP (Redis/Valkey-compatible) keyspace + a
# transparent PostgREST row cache. Bundled in the image but NOT active by default.
#
# To ENABLE it, add `pg_keyspace` to shared_preload_libraries in
# postgresql.conf — placed BEFORE `supatype_mask` — and restart:
#
#   shared_preload_libraries = '..., pg_keyspace, supatype_mask'
#
# It requires shared_preload_libraries to run (it registers a background worker
# and requests shared memory at postmaster start), so activation is a deliberate
# restart, not a runtime toggle. Until then the settings below are inert
# placeholders. Once loaded it serves RESP2 on pg_keyspace.port.

# Fail closed: refuse to serve unless supatype_mask is loaded and outermost, so
# RESP never exposes a value the mask would have rewritten (§4.1). This is the
# platform posture; a standalone deployment can set it to off.
pg_keyspace.require_mask = on

# RESP listen port (worker w listens on port + w).
pg_keyspace.port = 6379

# Durability tier: ephemeral | relaxed | durable | replicated.
# ephemeral keeps writes in shared memory only (Valkey parity); the others
# persist to supacache.kv. See extensions/pg_keyspace/README.md.
pg_keyspace.durability = 'ephemeral'

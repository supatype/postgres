# pg_keyspace — Postgres-native RESP (Redis/Valkey-compatible) keyspace + a
# transparent PostgREST row cache. Bundled in the image but NOT active by default.
#
# To ENABLE it, set SUPATYPE_KEYSPACE_ENABLED=1 on the container. The entrypoint then
# rewrites this file before any server starts -- adding pg_keyspace to
# shared_preload_libraries (before supatype_mask, so the mask stays outermost) and
# writing the settings below from SUPATYPE_KEYSPACE_* -- and creates the extension in
# POSTGRES_DB during initialisation, so the first real start already persists.
#
#   SUPATYPE_KEYSPACE_ENABLED              1 to turn it on; anything else leaves this file alone
#   SUPATYPE_KEYSPACE_DURABILITY           ephemeral (default) | relaxed | durable | replicated
#   SUPATYPE_KEYSPACE_DURABILITY_OVERRIDES prefix=tier pairs, e.g. 'kong_acme:=durable'
#   SUPATYPE_KEYSPACE_PORT                 RESP listen port (default 6379)
#   SUPATYPE_KEYSPACE_DATABASE             holds supacache.kv (default: POSTGRES_DB)
#   SUPATYPE_KEYSPACE_KEYS                 capacity per worker (default 200000)
#   SUPATYPE_KEYSPACE_VAL_BYTES            average value size (default 512)
#   SUPATYPE_KEYSPACE_RING_MB              persistence ring (default 16)
#   SUPATYPE_KEYSPACE_ROWCACHE_MB          Mode B segment (default 1; see the note below)
#   SUPATYPE_KEYSPACE_ROWCACHE_DECODE      Mode B invalidation worker: off (default) | on
#   SUPATYPE_KEYSPACE_ROWCACHE_READTHROUGH warm the row cache on a pk miss: off (default) | on
#   SUPATYPE_KEYSPACE_ROWCACHE_DECODE_MS   decode interval when decode is on (default 200)
#   SUPATYPE_KEYSPACE_SLOT_WAL_KEEP        max_slot_wal_keep_size while decoding (default 512MB)
#   SUPATYPE_KEYSPACE_OUTPUT_PLUGIN_LIBRARIES  allowlist for the decode plugin (default supacache_keys)
#   SUPATYPE_KEYSPACE_REQUIRE_MASK         on (default, platform posture) | off (standalone)
#   SUPATYPE_SHARED_PRELOAD_LIBRARIES      escape hatch if the image's own list moves ahead
#
# Sizing is shared memory, reserved at postmaster start whether or not the cache is used. The
# extension's own defaults (1M keys x 512 B) reserve ~689 MiB per worker before rings and row
# cache, which is larger than some deployments' entire memory limit -- hence the smaller ones
# above. Measured on PG16: the store matches the documented formula to within 2.3 KB, but
# rowcache_mb is a *request* rather than a reservation: the segment carries a fixed ~15.8 MiB
# directory for 200k entries on top of it, so rowcache_mb=1 costs ~16.7 MiB and 0 is refused.
#
# Everything below is the shipped, inert default. With SUPATYPE_KEYSPACE_ENABLED unset it is
# what the cluster reads, and pg_keyspace stays absent from shared_preload_libraries.

# Fail closed: refuse to serve unless supatype_mask is loaded and outermost, so
# RESP never exposes a value the mask would have rewritten (§4.1). This is the
# platform posture; a standalone deployment can set it to off.
pg_keyspace.require_mask = on

# RESP listen port (worker w listens on port + w).
pg_keyspace.port = 6379

# Durability tier: ephemeral | relaxed | durable | replicated.
# ephemeral keeps writes in shared memory only (Valkey parity); the others
# persist to supacache.kv. See extensions/pg_keyspace/README.md.
pg_keyspace.durability = 'ephemeral'

# Per-key durability: prefix=tier pairs overriding the tier above for the keys
# under each prefix, longest prefix first. This is how one instance serves a
# cache that costs nothing to write alongside state that has to survive a
# restart, instead of putting every cache write through the WAL to protect the
# small part that matters. Matching is on the key as stored, which is the
# tenant-scoped '{tenant}:{key}' form when RESP AUTH is configured.
#
# Leave it empty for one tier across the whole keyspace. Example -- Kong's
# ACME certificates durable, everything else ephemeral:
#
#   pg_keyspace.durability_overrides = 'kong_acme:=durable'
#
# The rings and the commit mode are provisioned for the strongest tier named,
# so the line above starts the persistence machinery even with the ephemeral
# default. Composes with pg_keyspace.workers > 1 in either addressing mode.
#pg_keyspace.durability_overrides = ''

# ── Mode B: the transparent row cache ────────────────────────────────────────
#
# Off here, and off is the shipped posture. The segment is reserved either way
# (that is rowcache_mb, taken at postmaster start), but with decode off nothing
# registers, decodes or serves from it.
#
# Both of these are PGC_POSTMASTER, so they are settings a server reads before
# it starts rather than anything that can be turned on live -- which is why they
# are written here from the environment rather than applied by a bootstrap
# script.
#
# rowcache_decode starts the keys-only invalidation worker. It needs
# wal_level = logical (this image sets it) and one replication slot per
# participating database.
#pg_keyspace.rowcache_decode = off
#
# rowcache_readthrough is what puts the cache on the read path: it warms a row
# on a primary-key miss, and it is what makes the planner choose
# `Custom Scan (pg_keyspace_rowcache)` over a plain index scan. Measured on
# PG16 -- with decode on and readthrough off, EXPLAIN still shows
# `Index Scan using <pk>` and the cache is inert for reads.
#
# The entrypoint refuses readthrough without decode rather than passing it
# through: a row warmed with no invalidation worker is never dropped when the
# table changes, so it would be served stale until it was evicted.
#pg_keyspace.rowcache_readthrough = off
#
# How long the decoder may wait between advances; also the upper bound on how
# long a changed row can still be served from cache.
#pg_keyspace.rowcache_decode_ms = 200

# Two settings that are not pg_keyspace's but that Mode B does not work
# without. The entrypoint writes both, and only when decode is on.
#
# PostgreSQL allowlists logical decoding output plugins, so without the first
# one creating the slot is refused:
#
#   ERROR: library "supacache_keys" may not be used as an output plugin
#   HINT:  ... add it to "output_plugin_libraries" and reload
#
# The invalidation worker retries, so the symptom is a background worker exiting
# with code 1 once a second beside a keyspace that is otherwise healthy, which
# reads like a broken build rather than a missing setting.
#output_plugin_libraries = 'supacache_keys'
#
# And a decode slot pins WAL from its restart_lsn until this bound cuts it
# loose, so on a small volume an unbounded slot is a disk-full outage. The
# image's global default is 4096 in postgresql.conf; this include is read after
# it, so the tighter value written here wins, and a -c on the command line wins
# over both.
#max_slot_wal_keep_size = '512MB'

# Which database pg_cron schedules from.
#
# Rewritten at container start from POSTGRES_DB by scripts/supatype-entrypoint.sh, because the
# right value is not knowable at build time and this setting is PGC_POSTMASTER: it has to be
# correct before Postgres starts, including the temporary server the bootstrap runs against.
#
# The value below is only what a run that bypasses the entrypoint gets. Ordinarily this file is
# overwritten before it is ever read.
cron.database_name = 'postgres'

# PostgreSQL configuration for supatype-postgres (slim Docker image)

#------------------------------------------------------------------------------
# FILE LOCATIONS
#------------------------------------------------------------------------------

data_directory = '/var/lib/postgresql/data'
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

listen_addresses = '*'
authentication_timeout = 1min
password_encryption = scram-sha-256

ssl = off

#------------------------------------------------------------------------------
# RESOURCE USAGE
#------------------------------------------------------------------------------

shared_buffers = 128MB
effective_cache_size = 128MB

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG
#------------------------------------------------------------------------------

wal_level = logical
max_wal_senders = 10
max_replication_slots = 5
max_slot_wal_keep_size = 4096
checkpoint_completion_target = 0.5
checkpoint_flush_after = 256kB

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------

row_security = on

#------------------------------------------------------------------------------
# REPORTING AND LOGGING
#------------------------------------------------------------------------------

log_line_prefix = '%h %m [%p] %q%u@%d '
log_statement = 'ddl'
log_timezone = 'UTC'

#------------------------------------------------------------------------------
# LOCALE
#------------------------------------------------------------------------------

timezone = 'UTC'
extra_float_digits = 0
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

#------------------------------------------------------------------------------
# EXTENSIONS
#------------------------------------------------------------------------------

# supatype_mask must be preloaded, not merely installed: it registers the `supatype`
# security label provider, and without the provider a SECURITY LABEL naming it fails.
#
# In shared_preload_libraries rather than session_preload_libraries, alongside the other
# query-path guards. session_preload_libraries is PGC_SUSET, so a superuser could pin a
# narrower list onto the data-plane role — `ALTER ROLE authenticated SET
# session_preload_libraries = 'pg_guard'` — and silently unmask every column for the whole
# API surface. shared_preload_libraries is PGC_POSTMASTER and cannot be overridden per
# role or per database at all.
shared_preload_libraries = 'pg_stat_statements, pg_cron, pg_net, plan_filter, safeupdate, supatype_mask'
session_preload_libraries = 'pg_guard'

# Output plugins are allow-listed now: without this, `pg_create_logical_replication_slot(…,
# 'wal2json')` fails with `library "wal2json" may not be used as an output plugin`. Every
# replication user shares one list, so it names the plugin the stack actually decodes with and
# nothing else — realtime reads WAL through wal2json, and an empty list means realtime cannot
# start at all rather than degrading.
output_plugin_libraries = 'wal2json'

cron.database_name = 'postgres'
pg_net.batch_size = 200

#------------------------------------------------------------------------------
# SUPAUTILS
#------------------------------------------------------------------------------

include = '/etc/postgresql-custom/pg_guard.conf'
include = '/etc/postgresql-custom/supatype_mask.conf'

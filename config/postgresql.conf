# PostgreSQL configuration for supatype-postgres (slim Docker image)

#------------------------------------------------------------------------------
# FILE LOCATIONS
#------------------------------------------------------------------------------

data_directory = '/var/lib/postgresql/data'
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'

#------------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
#------------------------------------------------------------------------------

listen_addresses = '*'
authentication_timeout = 1min
password_encryption = scram-sha-256

ssl = off

#------------------------------------------------------------------------------
# RESOURCE USAGE
#------------------------------------------------------------------------------

shared_buffers = 128MB
effective_cache_size = 128MB

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG
#------------------------------------------------------------------------------

wal_level = logical
max_wal_senders = 10
max_replication_slots = 5
max_slot_wal_keep_size = 4096
checkpoint_completion_target = 0.5
checkpoint_flush_after = 256kB

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------

row_security = on

#------------------------------------------------------------------------------
# REPORTING AND LOGGING
#------------------------------------------------------------------------------

log_line_prefix = '%h %m [%p] %q%u@%d '
log_statement = 'ddl'
log_timezone = 'UTC'

#------------------------------------------------------------------------------
# LOCALE
#------------------------------------------------------------------------------

timezone = 'UTC'
extra_float_digits = 0
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

#------------------------------------------------------------------------------
# EXTENSIONS
#------------------------------------------------------------------------------

shared_preload_libraries = 'pg_stat_statements, pg_cron, pg_net, plan_filter, safeupdate'
session_preload_libraries = 'pg_guard'

cron.database_name = 'postgres'
pg_net.batch_size = 200

#------------------------------------------------------------------------------
# SUPAUTILS
#------------------------------------------------------------------------------

include = '/etc/postgresql-custom/pg_guard.conf'

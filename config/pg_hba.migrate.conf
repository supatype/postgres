# Client authentication for the migration window only.
#
# The entrypoint starts a temporary server with this file when it finds a data
# directory that already holds a cluster, so that it can apply migrations the
# stock entrypoint would skip (#138). That server runs with
# listen_addresses = '' -- it has no TCP socket at all -- so the only thing this
# file can admit is a process already inside the container, running as a user
# pg_ident maps to a role.
#
# It exists because the shipped pg_hba.conf requires scram-sha-256 for
# supatype_admin even over the Unix socket, and a container restart carries no
# POSTGRES_PASSWORD: the official image requires that variable only to
# initialise a new data directory. Peer authentication needs no secret, and the
# OS user it admits (postgres, via supatype_map) is the one that owns the data
# directory already.
#
# The real pg_hba.conf is back in force for the server clients actually connect
# to; nothing here outlives the migration.

# TYPE  DATABASE  USER  ADDRESS  METHOD
local   all       all            peer map=supatype_map

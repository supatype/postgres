; PgBouncer Session Pool Configuration
; Port 5432 — externally exposed for developer direct connections
; Connections persist for entire session (psql, GUIs, ORMs)

[databases]
shared = host=postgres port=5432 dbname=shared

[pgbouncer]
; Session pool mode — connections persist for entire session
pool_mode = session
listen_port = 5432
listen_addr = 0.0.0.0

; TLS
client_tls_sslmode = require
client_tls_cert_file = /etc/pgbouncer/server.crt
client_tls_key_file = /etc/pgbouncer/server.key
server_tls_sslmode = require

; Pool sizing
; Free tier: 3 per project, Pro: 20, Team: 50
; Default pool ensures fairness across projects
default_pool_size = 3
max_client_conn = 200
max_db_connections = 100

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Logging
log_connections = 1
log_disconnections = 1
stats_period = 60

; Timeouts
server_idle_timeout = 300
client_idle_timeout = 600

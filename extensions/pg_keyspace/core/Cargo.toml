[package]
name = "pg_keyspace_core"
version = "0.1.0"
edition = "2021"
description = "pg_keyspace core: shared-memory RESP keyspace hot path, shared verbatim with the pgrx extension and benchmarked against Valkey/Redis"
license = "Apache-2.0"

[lib]
name = "pgks"
path = "src/lib.rs"

[[bin]]
name = "pgkeyspaced"
path = "src/bin/pgkeyspaced.rs"

[dependencies]
libc = "0.2"
sha2 = "0.11"
rustls = "0.21"
rustls-pemfile = "1"
# Cross-platform readiness: epoll on Linux, kqueue on macOS. `os-poll` gives
# Poll/Events/Registry/Interest/Token; `os-ext` gives unix::SourceFd so we can
# register our own raw fds (we manage the sockets/shm ourselves via libc).
mio = { version = "1.0", features = ["os-poll", "os-ext"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
